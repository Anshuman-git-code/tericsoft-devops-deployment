<rect x="0" y="0" width="1600" height="104" rx="0" fill="#10243A" stroke="#10243A" stroke-width="0" /><text x="54" y="48" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start" >06  /  REPOSITORY STRUCTURE</text><text x="54" y="80" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#C8D7E7" text-anchor="start" >A small, reviewable repository. Application, infrastructure, scripts, assets and documentation have separate responsibilities.</text><rect x="55" y="145" width="930" height="910" rx="22" fill="#101F32" stroke="#29465F" stroke-width="2" filter="url(#shadow)" /><text x="90" y="202" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="800" fill="#FFFFFF" text-anchor="start" >tericsoft-devops-deployment/</text><text x="95" y="250" font-family="monospace" font-size="18" font-weight="600" fill="#2F80ED" text-anchor="start" >├── app/</text><text x="600" y="250" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Static application</text><text x="95" y="284" font-family="monospace" font-size="18" font-weight="600" fill="#AFCBE7" text-anchor="start" >│   └── index.html</text><text x="600" y="284" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >The page Nginx serves</text><text x="95" y="318" font-family="monospace" font-size="18" font-weight="600" fill="#27A6C7" text-anchor="start" >├── nginx/</text><text x="600" y="318" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Web server configuration</text><text x="95" y="352" font-family="monospace" font-size="18" font-weight="600" fill="#AFCBE7" text-anchor="start" >│   └── default.conf</text><text x="600" y="352" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Nginx listens on 8081</text><text x="95" y="386" font-family="monospace" font-size="18" font-weight="600" fill="#198754" text-anchor="start" >├── scripts/</text><text x="600" y="386" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >EC2 bootstrap script</text><text x="95" y="420" font-family="monospace" font-size="18" font-weight="600" fill="#AFCBE7" text-anchor="start" >│   └── install_docker.sh</text><text x="600" y="420" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Installs and starts Docker</text><text x="95" y="454" font-family="monospace" font-size="18" font-weight="600" fill="#7656C8" text-anchor="start" >├── terraform/</text><text x="600" y="454" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Infrastructure as Code</text><text x="95" y="488" font-family="monospace" font-size="18" font-weight="600" fill="#CBBDF0" text-anchor="start" >│   ├── versions.tf</text><text x="600" y="488" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Terraform / provider constraints</text><text x="95" y="522" font-family="monospace" font-size="18" font-weight="600" fill="#CBBDF0" text-anchor="start" >│   ├── providers.tf</text><text x="600" y="522" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >AWS provider + region</text><text x="95" y="556" font-family="monospace" font-size="18" font-weight="600" fill="#CBBDF0" text-anchor="start" >│   ├── variables.tf</text><text x="600" y="556" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Inputs and validation</text><text x="95" y="590" font-family="monospace" font-size="18" font-weight="600" fill="#CBBDF0" text-anchor="start" >│   ├── network.tf</text><text x="600" y="590" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >VPC / subnets / IGW / routes</text><text x="95" y="624" font-family="monospace" font-size="18" font-weight="600" fill="#CBBDF0" text-anchor="start" >│   ├── security.tf</text><text x="600" y="624" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >EC2 + ECS security groups</text><text x="95" y="658" font-family="monospace" font-size="18" font-weight="600" fill="#CBBDF0" text-anchor="start" >│   ├── iam.tf</text><text x="600" y="658" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >EC2 instance profile and role</text><text x="95" y="692" font-family="monospace" font-size="18" font-weight="600" fill="#CBBDF0" text-anchor="start" >│   ├── ecr.tf</text><text x="600" y="692" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Private container repository</text><text x="95" y="726" font-family="monospace" font-size="18" font-weight="600" fill="#CBBDF0" text-anchor="start" >│   ├── ec2.tf</text><text x="600" y="726" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >AMI / key pair / EC2 instance</text><text x="95" y="760" font-family="monospace" font-size="18" font-weight="600" fill="#CBBDF0" text-anchor="start" >│   ├── ecs.tf</text><text x="600" y="760" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Optional Fargate resources</text><text x="95" y="794" font-family="monospace" font-size="18" font-weight="600" fill="#CBBDF0" text-anchor="start" >│   ├── outputs.tf</text><text x="600" y="794" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Public IP / URL / repo outputs</text><text x="95" y="828" font-family="monospace" font-size="18" font-weight="600" fill="#CBBDF0" text-anchor="start" >│   ├── .terraform.lock.hcl</text><text x="600" y="828" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Generated provider lock; commit it</text><text x="95" y="862" font-family="monospace" font-size="18" font-weight="600" fill="#CBBDF0" text-anchor="start" >│   └── terraform.tfvars.example</text><text x="600" y="862" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Safe example values</text><text x="95" y="896" font-family="monospace" font-size="18" font-weight="600" fill="#D98A18" text-anchor="start" >├── assets/</text><text x="600" y="896" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >README diagrams and illustrations</text><text x="95" y="930" font-family="monospace" font-size="18" font-weight="600" fill="#BFD0DF" text-anchor="start" >├── Dockerfile</text><text x="600" y="930" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Builds the Nginx application image</text><text x="95" y="964" font-family="monospace" font-size="18" font-weight="600" fill="#BFD0DF" text-anchor="start" >├── .dockerignore</text><text x="600" y="964" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Reduces Docker build context</text><text x="95" y="998" font-family="monospace" font-size="18" font-weight="600" fill="#BFD0DF" text-anchor="start" >├── .gitignore</text><text x="600" y="998" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Excludes local and sensitive files</text><text x="95" y="1032" font-family="monospace" font-size="18" font-weight="600" fill="#BFD0DF" text-anchor="start" >└── README.md</text><text x="600" y="1032" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#D5E1EC" text-anchor="start" >Usage, architecture and results</text><rect x="1025" y="165" width="520" height="240" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="1025" y="165" width="9" height="240" rx="5" fill="#2F80ED" stroke="#2F80ED" stroke-width="0" /><text x="1053" y="205" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#203040" text-anchor="start" >Committed to GitHub</text><text x="1053" y="242" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="450" fill="#5F7184" text-anchor="start"><tspan x="1053" dy="0">Source code and documentation</tspan><tspan x="1053" dy="26">Terraform .tf files</tspan><tspan x="1053" dy="26">.terraform.lock.hcl after init</tspan><tspan x="1053" dy="26">PNG + SVG files under assets/</tspan></text><rect x="1025" y="445" width="520" height="245" rx="18" fill="#FFF8F8" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="1025" y="445" width="9" height="245" rx="5" fill="#C65353" stroke="#C65353" stroke-width="0" /><text x="1053" y="485" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#203040" text-anchor="start" >Local only — never commit</text><text x="1053" y="522" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="450" fill="#5F7184" text-anchor="start"><tspan x="1053" dy="0">terraform.tfvars (real values)</tspan><tspan x="1053" dy="26">Private SSH key (*.pem / *.key)</tspan><tspan x="1053" dy="26">AWS credentials or .env secrets</tspan><tspan x="1053" dy="26">.terraform/ working directory</tspan><tspan x="1053" dy="26">terraform.tfstate and plan files</tspan></text><rect x="1025" y="725" width="520" height="250" rx="18" fill="#E8F6F1" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="1025" y="725" width="9" height="250" rx="5" fill="#198754" stroke="#198754" stroke-width="0" /><text x="1053" y="765" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#203040" text-anchor="start" >Generated / updated over time</text><text x="1053" y="802" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="450" fill="#5F7184" text-anchor="start"><tspan x="1053" dy="0">.terraform.lock.hcl is generated by init</tspan><tspan x="1053" dy="26">README status updated after real deployment</tspan><tspan x="1053" dy="26">Do not publish a temporary IP unless intended</tspan><tspan x="1053" dy="26">Delete temporary AWS resources after demo</tspan></text></svg>