<rect width="100%" height="100%" fill="#F7F9FC"/>
<rect x="0" y="0" width="1900" height="104" rx="0" fill="#10243A" stroke="#10243A" stroke-width="0" /><text x="54" y="48" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start" >01  /  SOLUTION ARCHITECTURE</text><text x="54" y="80" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#C8D7E7" text-anchor="start" >One Nginx application; Terraform provisions AWS; the same ECR image is used by EC2 and the optional ECS Fargate service.</text><rect x="42" y="145" width="330" height="235" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="42" y="145" width="9" height="235" rx="5" fill="#2F80ED" stroke="#2F80ED" stroke-width="0" /><text x="70" y="185" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#203040" text-anchor="start" >Developer workstation</text><text x="70" y="222" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="450" fill="#5F7184" text-anchor="start"><tspan x="70" dy="0">HTML + Nginx + Dockerfile</tspan><tspan x="70" dy="26">Local Docker build and test</tspan><tspan x="70" dy="26">Buildx target: linux/amd64</tspan><tspan x="70" dy="26">Buildx pushes to ECR after first apply</tspan><tspan x="70" dy="26">Terraform CLI + Git</tspan></text><rect x="414" y="145" width="330" height="235" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="414" y="145" width="9" height="235" rx="5" fill="#203040" stroke="#203040" stroke-width="0" /><text x="442" y="185" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#203040" text-anchor="start" >GitHub repository</text><text x="442" y="222" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="450" fill="#5F7184" text-anchor="start"><tspan x="442" dy="0">Public source repository</tspan><tspan x="442" dy="26">app/  •  nginx/  •  scripts/</tspan><tspan x="442" dy="26">terraform/  •  assets/</tspan><tspan x="442" dy="26">Dockerfile  •  README.md</tspan></text><rect x="786" y="145" width="390" height="235" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="786" y="145" width="9" height="235" rx="5" fill="#7656C8" stroke="#7656C8" stroke-width="0" /><text x="814" y="185" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#203040" text-anchor="start" >Terraform configuration</text><text x="814" y="222" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="450" fill="#5F7184" text-anchor="start"><tspan x="814" dy="0">Network + security groups</tspan><tspan x="814" dy="26">IAM + EC2 + ECR resources</tspan><tspan x="814" dy="26">Optional ECS Fargate resources</tspan><tspan x="814" dy="26">plan → review → apply</tspan></text><path d="M372,255 L414,255" fill="none" stroke="#203040" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="393" y="234" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#203040" text-anchor="middle" >git push</text><path d="M981,380 L981,455" fill="none" stroke="#7656C8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)"/><text x="1010" y="425" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#7656C8" text-anchor="start" >Terraform provisions</text><rect x="40" y="465" width="1820" height="650" rx="24" fill="#FCFEFF" stroke="#9EB8D2" stroke-width="3" filter="url(#shadow)" /><rect x="40" y="465" width="1820" height="62" rx="20" fill="#10243A" stroke="#10243A" stroke-width="0" /><text x="78" y="506" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="start" >AWS CLOUD  /  ap-south-1 (Mumbai)</text><text x="1820" y="506" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#BBD0E4" text-anchor="end" >Terraform-managed resources</text><rect x="72" y="548" width="1280" height="520" rx="20" fill="#F1F7FD" stroke="#9DBDE0" stroke-width="2" /><text x="102" y="590" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#10243A" text-anchor="start" >VPC  •  10.0.0.0/16</text><text x="102" y="620" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start" >Internet Gateway + public route table: 0.0.0.0/0 → IGW</text><rect x="740" y="564" width="280" height="65" rx="12" fill="#FFFFFF" stroke="#82ACD9" stroke-width="2" /><text x="880" y="591" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#10243A" text-anchor="middle" >Public subnet A</text><text x="880" y="615" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#5F7184" text-anchor="middle" >10.0.1.0/24</text><rect x="1035" y="564" width="285" height="65" rx="12" fill="#FFFFFF" stroke="#82ACD9" stroke-width="2" /><text x="1177" y="591" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#10243A" text-anchor="middle" >Public subnet B</text><text x="1177" y="615" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#5F7184" text-anchor="middle" >10.0.2.0/24</text><rect x="102" y="655" width="565" height="382" rx="18" fill="#FFFFFF" stroke="#86BDA5" stroke-width="2" filter="url(#shadow)" /><rect x="128" y="676" width="188" height="34" rx="17" fill="#E8F6F1" stroke="#E8F6F1" stroke-width="1" /><text x="222.0" y="699" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#198754" text-anchor="middle" >MANDATORY  /  EC2</text><text x="128" y="746" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#10243A" text-anchor="start" >Amazon EC2</text><text x="128" y="782" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="128" dy="0">Amazon Linux 2023  •  x86-64</tspan><tspan x="128" dy="26">t3.micro  •  2 vCPU  •  1 GiB RAM</tspan><tspan x="128" dy="26">8 GiB encrypted gp3 root volume</tspan></text><rect x="128" y="866" width="510" height="77" rx="12" fill="#EAF3FF" stroke="#A9C9ED" stroke-width="1" /><text x="148" y="895" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#10243A" text-anchor="start" >Security group</text><text x="148" y="923" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start" >TCP 22: admin /32    •    TCP 8081: public</text><text x="128" y="979" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#198754" text-anchor="start" >Docker + Nginx  •  host 8081 → container 8081</text><text x="128" y="1013" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#198754" text-anchor="start" >http://EC2-PUBLIC-IP:8081</text><text x="128" y="1030" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#5F7184" text-anchor="start" >Pulls image from ECR with EC2 instance profile</text><rect x="700" y="655" width="620" height="382" rx="18" fill="#FFFFFF" stroke="#E3BE82" stroke-width="2" filter="url(#shadow)" /><rect x="728" y="676" width="190" height="34" rx="17" fill="#FFF4E2" stroke="#FFF4E2" stroke-width="1" /><text x="823.0" y="699" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#D98A18" text-anchor="middle" >OPTIONAL  /  ECS</text><text x="728" y="746" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#10243A" text-anchor="start" >Amazon ECS Fargate</text><text x="728" y="782" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="728" dy="0">Linux X86_64  •  256 CPU units  •  512 MiB</tspan><tspan x="728" dy="26">awsvpc networking  •  desired_count = 1</tspan><tspan x="728" dy="26">Task gets its own network interface + public IP</tspan></text><rect x="728" y="866" width="564" height="77" rx="12" fill="#F1EDFB" stroke="#C7B8EA" stroke-width="1" /><text x="748" y="895" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#10243A" text-anchor="start" >Task execution role</text><text x="748" y="923" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start" >Authorizes ECR image pull + CloudWatch log delivery</text><text x="728" y="979" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#D98A18" text-anchor="start" >Security group: public TCP 8081  •  CloudWatch logs</text><text x="728" y="1013" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#D98A18" text-anchor="start" >http://ECS-TASK-PUBLIC-IP:8081</text><rect x="1390" y="565" width="425" height="310" rx="18" fill="#FFFFFF" stroke="#C8B4EE" stroke-width="2" filter="url(#shadow)" /><rect x="1418" y="590" width="155" height="34" rx="17" fill="#F1EDFB" stroke="#F1EDFB" stroke-width="1" /><text x="1495.5" y="613" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#7656C8" text-anchor="middle" >SHARED IMAGE SOURCE</text><text x="1418" y="665" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#10243A" text-anchor="start" >Amazon ECR</text><text x="1418" y="708" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="1418" dy="0">Private repository: tericsoft-devops</tspan><tspan x="1418" dy="28">Tag: latest  •  platform: linux/amd64</tspan><tspan x="1418" dy="28">Image scan on push enabled</tspan></text><rect x="1418" y="805" width="365" height="50" rx="10" fill="#FFF4E2" stroke="#EBCB95" stroke-width="1" /><text x="1600" y="837" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#D98A18" text-anchor="middle" >EC2 + ECS pull this same image</text><path d="M1390,760 C1368,760 1360,760 1320,760" fill="none" stroke="#7656C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)"/><text x="1355" y="742" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#7656C8" text-anchor="middle" >pull</text><text x="1395" y="935" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#5F7184" text-anchor="start" >No Load Balancer or NAT Gateway</text><text x="1395" y="967" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start" >in this demonstration architecture.</text><text x="1395" y="1023" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#5F7184" text-anchor="start" >Public browser access is direct to :8081.</text><text x="78" y="1090" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#2F80ED" text-anchor="start" >DEPLOYMENT ORDER</text><text x="260" y="1090" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#10243A" text-anchor="start" >Terraform creates VPC / EC2 / ECR  →  Buildx pushes image  →  EC2 pulls and runs it  →  enable ECS for the bonus.</text></svg>