<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10243A"/><stop offset="100%" stop-color="#1B4261"/></linearGradient>
  <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3C91F7"/><stop offset="100%" stop-color="#2165B4"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#10243A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F80ED"/></marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#198754"/></marker>
  <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D98A18"/></marker>
  <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7656C8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
<rect x="0" y="0" width="1700" height="104" rx="0" fill="#10243A" stroke="#10243A" stroke-width="0" /><text x="54" y="48" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start" >02  /  NETWORK REQUEST FLOW</text><text x="54" y="80" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#C8D7E7" text-anchor="start" >What happens when a reviewer opens the public EC2 URL on TCP port 8081.</text><rect x="45" y="270" width="230" height="175" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="45" y="270" width="230" height="12" rx="6" fill="#2F80ED" stroke="#2F80ED" stroke-width="0" /><text x="63" y="322" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#10243A" text-anchor="start" >1  Browser / Internet</text><text x="63" y="363" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="63" dy="0">GET http://EC2-IP:8081</tspan><tspan x="63" dy="27">TCP connection to public IP</tspan></text><rect x="325" y="270" width="230" height="175" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="325" y="270" width="230" height="12" rx="6" fill="#7656C8" stroke="#7656C8" stroke-width="0" /><text x="343" y="322" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#10243A" text-anchor="start" >2  Internet Gateway</text><text x="343" y="363" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="343" dy="0">VPC edge connection</tspan><tspan x="343" dy="27">Attached to VPC</tspan></text><rect x="605" y="270" width="230" height="175" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="605" y="270" width="230" height="12" rx="6" fill="#D98A18" stroke="#D98A18" stroke-width="0" /><text x="623" y="322" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#10243A" text-anchor="start" >3  Public route table</text><text x="623" y="363" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="623" dy="0">0.0.0.0/0 → IGW</tspan><tspan x="623" dy="27">Associated with subnet A</tspan></text><rect x="885" y="270" width="230" height="175" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="885" y="270" width="230" height="12" rx="6" fill="#27A6C7" stroke="#27A6C7" stroke-width="0" /><text x="903" y="322" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#10243A" text-anchor="start" >4  Public subnet A</text><text x="903" y="363" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="903" dy="0">10.0.1.0/24</tspan><tspan x="903" dy="27">EC2 public IPv4 address</tspan></text><rect x="1165" y="270" width="230" height="175" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="1165" y="270" width="230" height="12" rx="6" fill="#198754" stroke="#198754" stroke-width="0" /><text x="1183" y="322" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#10243A" text-anchor="start" >5  EC2 security group</text><text x="1183" y="363" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="1183" dy="0">Inbound TCP 8081: public</tspan><tspan x="1183" dy="27">Inbound TCP 22: admin /32</tspan></text><rect x="1445" y="270" width="210" height="175" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="1445" y="270" width="210" height="12" rx="6" fill="#2F80ED" stroke="#2F80ED" stroke-width="0" /><text x="1463" y="322" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#10243A" text-anchor="start" >6  EC2 host port</text><text x="1463" y="363" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="1463" dy="0">Docker publishes</tspan><tspan x="1463" dy="27">0.0.0.0:8081</tspan></text><path d="M275,356 L315,356" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M555,356 L595,356" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M835,356 L875,356" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M1115,356 L1155,356" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M1395,356 L1435,356" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M1545,445 C1545,520 1350,525 1350,600" fill="none" stroke="#2F80ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1080" y="600" width="520" height="165" rx="18" fill="#EAF3FF" stroke="#A7C7EA" stroke-width="2" /><text x="1110" y="646" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#10243A" text-anchor="start" >7  Docker port publishing</text><text x="1110" y="687" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#2F80ED" text-anchor="start" >Host 8081  →  Container 8081</text><text x="1110" y="728" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start" >The left value is the EC2 host port; the right is the container port.</text><path d="M1080,682 C970,682 960,815 875,815" fill="none" stroke="#2F80ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="360" y="600" width="515" height="165" rx="18" fill="#E8F6F1" stroke="#A5D7C1" stroke-width="2" /><text x="390" y="646" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#10243A" text-anchor="start" >8  Nginx inside the container</text><text x="390" y="687" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#198754" text-anchor="start" >listen 8081;  →  serve index.html</text><text x="390" y="728" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start" >Nginx reads the copied file from /usr/share/nginx/html.</text><path d="M618,765 L618,835" fill="none" stroke="#198754" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/><rect x="360" y="835" width="515" height="105" rx="16" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><text x="390" y="880" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#10243A" text-anchor="start" >HTTP response: 200 OK  +  HTML page</text><text x="390" y="913" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start" >The reviewer sees the application in the browser.</text><rect x="45" y="970" width="1610" height="45" rx="12" fill="#EDF2F7" stroke="#D8E1EA" stroke-width="1" /><text x="70" y="1000" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#10243A" text-anchor="start" >Security rule summary:</text><text x="300" y="1000" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#198754" text-anchor="start" >TCP 8081 from 0.0.0.0/0 (required public demo)</text><text x="900" y="1000" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#D98A18" text-anchor="start" >TCP 22 from your public IPv4 /32 only (admin access)</text></svg>