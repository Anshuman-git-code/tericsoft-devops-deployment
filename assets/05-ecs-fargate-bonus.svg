<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10243A"/><stop offset="100%" stop-color="#1B4261"/></linearGradient>
  <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3C91F7"/><stop offset="100%" stop-color="#2165B4"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#10243A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F80ED"/></marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#198754"/></marker>
  <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D98A18"/></marker>
  <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7656C8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
<rect x="0" y="0" width="1700" height="104" rx="0" fill="#10243A" stroke="#10243A" stroke-width="0" /><text x="54" y="48" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start" >05  /  ECS FARGATE BONUS</text><text x="54" y="80" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#C8D7E7" text-anchor="start" >Reuse the verified ECR image. Enable ECS only after the image exists in the registry.</text><rect x="50" y="135" width="1600" height="90" rx="18" fill="#FFF4E2" stroke="#E9C98E" stroke-width="2" /><text x="82" y="174" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#D98A18" text-anchor="start" >PREREQUISITE</text><text x="300" y="174" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#10243A" text-anchor="start" >EC2 deployment works  +  ECR contains the linux/amd64 :latest image</text><text x="300" y="205" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start" >Then set enable_ecs = true (or pass -var="enable_ecs=true") and run plan → review → apply.</text><rect x="55" y="315" width="275" height="280" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="55" y="315" width="275" height="10" rx="5" fill="#7656C8" stroke="#7656C8" stroke-width="0" /><text x="75" y="366" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#10243A" text-anchor="start" >1  ECS foundation</text><text x="75" y="416" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="75" dy="0">Cluster</tspan><tspan x="75" dy="31">CloudWatch log group</tspan><tspan x="75" dy="31">Execution role + policy</tspan></text><rect x="375" y="315" width="275" height="280" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="375" y="315" width="275" height="10" rx="5" fill="#2F80ED" stroke="#2F80ED" stroke-width="0" /><text x="395" y="366" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#10243A" text-anchor="start" >2  Task definition</text><text x="395" y="416" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="395" dy="0">Fargate + awsvpc</tspan><tspan x="395" dy="31">Linux X86_64</tspan><tspan x="395" dy="31">256 CPU / 512 MiB</tspan><tspan x="395" dy="31">Container TCP 8081</tspan></text><rect x="695" y="315" width="275" height="280" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="695" y="315" width="275" height="10" rx="5" fill="#27A6C7" stroke="#27A6C7" stroke-width="0" /><text x="715" y="366" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#10243A" text-anchor="start" >3  ECS service</text><text x="715" y="416" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="715" dy="0">desired_count = 1</tspan><tspan x="715" dy="31">launch_type = FARGATE</tspan><tspan x="715" dy="31">Two public subnets</tspan></text><rect x="1015" y="315" width="275" height="280" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="1015" y="315" width="275" height="10" rx="5" fill="#198754" stroke="#198754" stroke-width="0" /><text x="1035" y="366" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#10243A" text-anchor="start" >4  Running task</text><text x="1035" y="416" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="1035" dy="0">Own ENI (awsvpc)</tspan><tspan x="1035" dy="31">Public IP assigned</tspan><tspan x="1035" dy="31">Security group: TCP 8081</tspan><tspan x="1035" dy="31">CloudWatch logs</tspan></text><rect x="1335" y="315" width="310" height="280" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="1335" y="315" width="310" height="10" rx="5" fill="#D98A18" stroke="#D98A18" stroke-width="0" /><text x="1355" y="366" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#10243A" text-anchor="start" >5  Browser access</text><text x="1355" y="416" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="1355" dy="0">HTTP to the task public IP</tspan><tspan x="1355" dy="31">TCP 8081 allowed by SG</tspan><tspan x="1355" dy="31">Nginx serves index.html</tspan></text><path d="M330,455 L367,455" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M650,455 L687,455" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M970,455 L1007,455" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M1290,455 L1327,455" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><rect x="55" y="670" width="470" height="130" rx="18" fill="#F1EDFB" stroke="#C9B9E9" stroke-width="2" /><text x="82" y="713" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#10243A" text-anchor="start" >Amazon ECR</text><text x="82" y="750" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#5F7184" text-anchor="start" >Private image repository  •  linux/amd64:latest</text><path d="M525,735 C720,735 870,660 1140,595" fill="none" stroke="#7656C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)"/><text x="840" y="704" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#7656C8" text-anchor="middle" >Execution role authorizes the ECR image pull</text><rect x="660" y="670" width="380" height="130" rx="18" fill="#EAF3FF" stroke="#A9C9EC" stroke-width="2" /><text x="688" y="713" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#10243A" text-anchor="start" >CloudWatch log group</text><text x="688" y="750" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start" >/ecs/tericsoft-devops  •  3-day retention</text><path d="M1135,595 C1110,640 1050,705 1040,735" fill="none" stroke="#2F80ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1075" y="666" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F80ED" text-anchor="middle" >awslogs</text><rect x="1110" y="670" width="535" height="130" rx="18" fill="#E8F6F1" stroke="#ACD9C5" stroke-width="2" /><text x="1140" y="713" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#10243A" text-anchor="start" >Browser verification</text><text x="1140" y="750" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#198754" text-anchor="start" >http://ECS-TASK-PUBLIC-IP:8081</text><path d="M1375,670 C1360,625 1290,610 1245,595" fill="none" stroke="#D98A18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)"/><text x="1395" y="632" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#D98A18" text-anchor="middle" >HTTP request</text><rect x="55" y="875" width="1590" height="115" rx="18" fill="#10243A" stroke="#10243A" stroke-width="0" /><text x="85" y="919" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#A7C7E8" text-anchor="start" >WHAT THE SERVICE DOES</text><text x="85" y="958" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start" >Maintains one desired task and replaces stopped tasks. Auto scaling is NOT configured in this assignment.</text></svg>