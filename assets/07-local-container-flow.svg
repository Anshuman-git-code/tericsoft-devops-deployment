<rect width="100%" height="100%" fill="#F7F9FC"/>
<rect x="0" y="0" width="1600" height="104" rx="0" fill="#10243A" stroke="#10243A" stroke-width="0" /><text x="54" y="48" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start" >07  /  LOCAL APPLICATION AND CONTAINER FLOW</text><text x="54" y="80" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#C8D7E7" text-anchor="start" >How HTML becomes a running Nginx container, and why EXPOSE differs from Docker port publishing.</text><rect x="70" y="260" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="70" y="260" width="300" height="12" rx="6" fill="#2F80ED" stroke="#2F80ED" stroke-width="0" /><text x="94" y="318" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#10243A" text-anchor="start" >HTML + Nginx config</text><text x="94" y="370" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="94" dy="0">app/index.html</tspan><tspan x="94" dy="31">nginx/default.conf</tspan><tspan x="94" dy="31">listen 8081;</tspan></text><rect x="455" y="260" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="455" y="260" width="300" height="12" rx="6" fill="#7656C8" stroke="#7656C8" stroke-width="0" /><text x="479" y="318" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#10243A" text-anchor="start" >Dockerfile</text><text x="479" y="370" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="479" dy="0">FROM nginx:alpine</tspan><tspan x="479" dy="31">COPY config + HTML</tspan><tspan x="479" dy="31">EXPOSE 8081</tspan></text><rect x="840" y="260" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="840" y="260" width="300" height="12" rx="6" fill="#D98A18" stroke="#D98A18" stroke-width="0" /><text x="864" y="318" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#10243A" text-anchor="start" >Docker image</text><text x="864" y="370" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="864" dy="0">docker build -t</tspan><tspan x="864" dy="31">tericsoft-devops:1.0 .</tspan><tspan x="864" dy="31">Immutable image layers</tspan></text><rect x="1225" y="260" width="300" height="230" rx="20" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="1225" y="260" width="300" height="12" rx="6" fill="#198754" stroke="#198754" stroke-width="0" /><text x="1249" y="318" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#10243A" text-anchor="start" >Running container</text><text x="1249" y="370" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="1249" dy="0">Nginx process</tspan><tspan x="1249" dy="31">Container port 8081</tspan><tspan x="1249" dy="31">Serves index.html</tspan></text><path d="M370,375 L443,375" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M755,375 L828,375" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M1140,375 L1213,375" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><rect x="270" y="575" width="1060" height="140" rx="20" fill="#10243A" stroke="#10243A" stroke-width="0" /><text x="315" y="625" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#A9C7E2" text-anchor="start" >Host / laptop port</text><text x="315" y="673" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="start" >8081</text><text x="700" y="650" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#A9C7E2" text-anchor="middle" >Docker publishes</text><text x="1015" y="625" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#A9C7E2" text-anchor="start" >Container port</text><text x="1015" y="673" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF" text-anchor="start" >8081</text><path d="M520,656 L900,656" fill="none" stroke="#D98A18" stroke-width="5" stroke-linecap="round" opacity="1" marker-end="url(#arrowAmber)"/><text x="800" y="610" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#D98A18" text-anchor="middle" >-p 8081:8081</text><text x="800" y="765" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="middle" >EXPOSE 8081 documents the port; -p 8081:8081 publishes it to the host.</text></svg>