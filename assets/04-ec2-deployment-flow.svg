<rect width="100%" height="100%" fill="#F7F9FC"/>
<rect x="0" y="0" width="1700" height="104" rx="0" fill="#10243A" stroke="#10243A" stroke-width="0" /><text x="54" y="48" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start" >04  /  MANDATORY EC2 DEPLOYMENT</text><text x="54" y="80" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#C8D7E7" text-anchor="start" >Build and test locally, provision the foundation with Terraform, publish to ECR, then pull and run on EC2.</text><rect x="55" y="220" width="255" height="210" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="55" y="220" width="255" height="11" rx="5" fill="#2F80ED" stroke="#2F80ED" stroke-width="0" /><text x="75" y="270" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#10243A" text-anchor="start" >01  Application files</text><text x="75" y="313" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="75" dy="0">app/index.html</tspan><tspan x="75" dy="29">nginx/default.conf</tspan><tspan x="75" dy="29">Dockerfile</tspan></text><rect x="360" y="220" width="255" height="210" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="360" y="220" width="255" height="11" rx="5" fill="#27A6C7" stroke="#27A6C7" stroke-width="0" /><text x="380" y="270" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#10243A" text-anchor="start" >02  Local Docker test</text><text x="380" y="313" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="380" dy="0">docker build</tspan><tspan x="380" dy="29">docker run -p 8081:8081</tspan><tspan x="380" dy="29">curl localhost:8081</tspan></text><rect x="665" y="220" width="255" height="210" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="665" y="220" width="255" height="11" rx="5" fill="#7656C8" stroke="#7656C8" stroke-width="0" /><text x="685" y="270" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#10243A" text-anchor="start" >03  Terraform apply</text><text x="685" y="313" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="685" dy="0">VPC + 2 public subnets</tspan><tspan x="685" dy="29">IGW + route table + SG</tspan><tspan x="685" dy="29">EC2 + IAM + ECR</tspan></text><rect x="970" y="220" width="255" height="210" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="970" y="220" width="255" height="11" rx="5" fill="#D98A18" stroke="#D98A18" stroke-width="0" /><text x="990" y="270" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#10243A" text-anchor="start" >04  Buildx → ECR</text><text x="990" y="313" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="990" dy="0">Target linux/amd64</tspan><tspan x="990" dy="29">Tag :latest</tspan><tspan x="990" dy="29">Push to private ECR</tspan></text><rect x="1275" y="220" width="350" height="210" rx="18" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="1275" y="220" width="350" height="11" rx="5" fill="#198754" stroke="#198754" stroke-width="0" /><text x="1295" y="270" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#10243A" text-anchor="start" >05  SSH to EC2</text><text x="1295" y="313" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="1295" dy="0">Amazon Linux 2023</tspan><tspan x="1295" dy="29">Verify Docker service</tspan><tspan x="1295" dy="29">ECR read-only instance role</tspan></text><path d="M310,324 L352,324" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M615,324 L657,324" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M920,324 L962,324" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M1225,324 L1267,324" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" opacity="1" marker-end="url(#arrow)"/><path d="M1450,430 C1450,520 1270,530 1270,605" fill="none" stroke="#198754" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/><rect x="970" y="605" width="600" height="205" rx="20" fill="#E8F6F1" stroke="#ABD9C7" stroke-width="2" filter="url(#shadow)" /><text x="1010" y="656" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#10243A" text-anchor="start" >06  Pull and run the container</text><text x="1010" y="705" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="1010" dy="0">aws ecr get-login-password  →  docker login</tspan><tspan x="1010" dy="31">docker pull ECR_URI:latest</tspan><tspan x="1010" dy="31">docker run -d --restart unless-stopped -p 8081:8081</tspan></text><path d="M970,710 L700,710" fill="none" stroke="#198754" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/><rect x="340" y="605" width="360" height="205" rx="20" fill="#EAF3FF" stroke="#A8C9ED" stroke-width="2" filter="url(#shadow)" /><text x="375" y="656" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#10243A" text-anchor="start" >07  Validate on EC2</text><text x="375" y="705" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="375" dy="0">docker ps</tspan><tspan x="375" dy="31">curl -i http://localhost:8081</tspan><tspan x="375" dy="31">Check logs + port mapping</tspan></text><path d="M520,810 L520,885" fill="none" stroke="#2F80ED" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="340" y="885" width="1230" height="100" rx="18" fill="#10243A" stroke="#10243A" stroke-width="0" /><text x="375" y="927" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="start" >08  Public browser verification</text><text x="375" y="961" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="500" fill="#CFE0F1" text-anchor="start" >http://EC2-PUBLIC-IP:8081   •   Expected: HTTP 200 OK and the application page</text></svg>