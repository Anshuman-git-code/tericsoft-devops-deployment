<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1050" viewBox="0 0 1700 1050">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#10243A"/><stop offset="100%" stop-color="#1B4261"/></linearGradient>
  <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#3C91F7"/><stop offset="100%" stop-color="#2165B4"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#10243A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2F80ED"/></marker>
  <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#198754"/></marker>
  <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D98A18"/></marker>
  <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7656C8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#F7F9FC"/>
<rect x="0" y="0" width="1700" height="104" rx="0" fill="#10243A" stroke="#10243A" stroke-width="0" /><text x="54" y="48" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start" >03  /  TERRAFORM WORKFLOW</text><text x="54" y="80" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#C8D7E7" text-anchor="start" >The exact staged workflow: write and validate locally first; plan and apply only after AWS identity is available.</text><rect x="48" y="145" width="770" height="690" rx="20" fill="#F0F6FF" stroke="#B8D0EE" stroke-width="2" /><rect x="78" y="170" width="230" height="34" rx="17" fill="#EAF3FF" stroke="#EAF3FF" stroke-width="1" /><text x="193.0" y="193" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#2F80ED" text-anchor="middle" >PHASE A  •  NO AWS ACCOUNT</text><rect x="858" y="145" width="795" height="690" rx="20" fill="#FFF9EF" stroke="#E9D5B5" stroke-width="2" /><rect x="890" y="170" width="245" height="34" rx="17" fill="#FFF4E2" stroke="#FFF4E2" stroke-width="1" /><text x="1012.5" y="193" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#D98A18" text-anchor="middle" >PHASE B  •  AWS AUTH REQUIRED</text><rect x="85" y="245" width="300" height="135" rx="16" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="85" y="245" width="8" height="135" rx="4" fill="#7656C8" stroke="#7656C8" stroke-width="0" /><text x="109" y="286" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#10243A" text-anchor="start" >1  Write .tf files</text><text x="109" y="323" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="109" dy="0">versions / provider / variables</tspan><tspan x="109" dy="24">network / security / IAM</tspan><tspan x="109" dy="24">EC2 / ECR / ECS / outputs</tspan></text><rect x="465" y="245" width="300" height="135" rx="16" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="465" y="245" width="8" height="135" rx="4" fill="#2F80ED" stroke="#2F80ED" stroke-width="0" /><text x="489" y="286" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#10243A" text-anchor="start" >2  terraform init</text><text x="489" y="323" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="489" dy="0">Download AWS provider</tspan><tspan x="489" dy="24">Create/update lock file</tspan></text><rect x="85" y="445" width="300" height="135" rx="16" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="85" y="445" width="8" height="135" rx="4" fill="#198754" stroke="#198754" stroke-width="0" /><text x="109" y="486" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#10243A" text-anchor="start" >4  terraform validate</text><text x="109" y="523" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="109" dy="0">Check configuration structure</tspan><tspan x="109" dy="24">No live infrastructure plan</tspan></text><rect x="465" y="445" width="300" height="135" rx="16" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="465" y="445" width="8" height="135" rx="4" fill="#27A6C7" stroke="#27A6C7" stroke-width="0" /><text x="489" y="486" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#10243A" text-anchor="start" >3  terraform fmt</text><text x="489" y="523" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="489" dy="0">Normalize HCL formatting</tspan><tspan x="489" dy="24">No AWS resource is created</tspan></text><path d="M385,312 L465,312" fill="none" stroke="#2F80ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M615,380 L615,445" fill="none" stroke="#2F80ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M465,512 L385,512" fill="none" stroke="#2F80ED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="80" y="660" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#10243A" text-anchor="start" >Phase A result</text><text x="80" y="700" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="80" dy="0">Terraform source is ready and pushed to GitHub.</tspan><tspan x="80" dy="30">No EC2, VPC, ECR or ECS resources exist yet.</tspan></text><rect x="895" y="245" width="320" height="135" rx="16" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="895" y="245" width="8" height="135" rx="4" fill="#D98A18" stroke="#D98A18" stroke-width="0" /><text x="919" y="286" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#10243A" text-anchor="start" >5  Verify AWS identity</text><text x="919" y="323" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="919" dy="0">aws sts get-caller-identity</tspan><tspan x="919" dy="24">Confirm account + selected profile</tspan></text><rect x="1290" y="245" width="320" height="135" rx="16" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="1290" y="245" width="8" height="135" rx="4" fill="#2F80ED" stroke="#2F80ED" stroke-width="0" /><text x="1314" y="286" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#10243A" text-anchor="start" >6  terraform plan</text><text x="1314" y="323" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="1314" dy="0">Read live AZ / AMI data</tspan><tspan x="1314" dy="24">Review proposed AWS changes</tspan></text><rect x="895" y="445" width="320" height="135" rx="16" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="895" y="445" width="8" height="135" rx="4" fill="#27A6C7" stroke="#27A6C7" stroke-width="0" /><text x="919" y="486" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#10243A" text-anchor="start" >8  Read outputs + verify</text><text x="919" y="523" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="919" dy="0">EC2 public IP + URL</tspan><tspan x="919" dy="24">Check resources in AWS Console</tspan></text><rect x="1290" y="445" width="320" height="135" rx="16" fill="#FFFFFF" stroke="#D9E2EC" stroke-width="2" filter="url(#shadow)" /><rect x="1290" y="445" width="8" height="135" rx="4" fill="#198754" stroke="#198754" stroke-width="0" /><text x="1314" y="486" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#10243A" text-anchor="start" >7  terraform apply</text><text x="1314" y="523" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="1314" dy="0">Create VPC, subnets, routes</tspan><tspan x="1314" dy="24">SG, EC2, IAM, ECR</tspan></text><path d="M1215,312 L1290,312" fill="none" stroke="#D98A18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)"/><path d="M1450,380 L1450,445" fill="none" stroke="#D98A18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)"/><path d="M1290,512 L1215,512" fill="none" stroke="#D98A18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)"/><text x="895" y="660" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#10243A" text-anchor="start" >ECS bonus gate</text><text x="895" y="700" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#5F7184" text-anchor="start"><tspan x="895" dy="0">First build + push the linux/amd64 image to ECR.</tspan><tspan x="895" dy="30">Then set enable_ecs=true and plan/apply again.</tspan></text><rect x="48" y="875" width="1605" height="120" rx="18" fill="#10243A" stroke="#10243A" stroke-width="0" /><text x="82" y="922" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#9FC2E6" text-anchor="start" >CLEANUP</text><text x="82" y="961" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start" >terraform destroy</text><text x="430" y="922" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start" >After recording and verification</text><text x="430" y="961" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#CFDCE8" text-anchor="start" >Destroy temporary resources, then verify EC2, ECS, ECR, EBS and CloudWatch resources are gone.</text></svg>