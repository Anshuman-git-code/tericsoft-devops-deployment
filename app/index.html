<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tericsoft DevOps Deployment</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #1f2937;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        main {
            max-width: 640px;
            margin: 24px;
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #123b63;
        }

        p {
            line-height: 1.6;
        }

        .status {
            display: inline-block;
            margin-top: 12px;
            padding: 8px 14px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <main>
        <h1>DevOps Internship Deployment</h1>
        <p>This application is running inside a Docker container.</p>
        <p>Web server: Nginx</p>
        <p>Container port: 8081</p>
        <p>Deployment target: Amazon EC2 and Amazon ECS</p>
        <div class="status">Application is running successfully</div>
    </main>
</body>
</html>
